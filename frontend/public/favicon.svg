<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1a17"/>
      <stop offset="100%" stop-color="#0a0908"/>
    </linearGradient>
    <linearGradient id="accGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e85934"/>
      <stop offset="100%" stop-color="#d4421f"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Deep ink squircle background -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="#33302a" stroke-width="1.5" fill="none"/>

  <!-- Crisp serif letter A -->
  <g filter="url(#shadow)">
    <!-- Main glyph -->
    <path d="M 18.5 47 L 28.5 16 L 34.5 16 L 44.5 47 L 38.6 47 L 36.1 38.8 L 26.6 38.8 L 24.1 47 Z M 31.4 22.8 L 28.1 33.8 L 34.6 33.8 Z" fill="#ffffff"/>
    
    <!-- Iconic Vermilion Accent Dot '.' (InterviewAce.) -->
    <circle cx="48" cy="44" r="4.5" fill="url(#accGrad)"/>
  </g>
</svg>
