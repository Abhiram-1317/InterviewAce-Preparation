<style>
:root{--bg:#fff;--card:#fff;--ink:#111;--mute:#6b6b6b;--line:#e7e5e1;--acc:#d4421f;--soft:#f6f4f0;--ok:#2f7d4f;--okb:#eef5f0;--warn:#8f6200;--warnb:#f8f1e0;--bad:#b3261e;--badb:#f9ebe9;--serif:Newsreader,Georgia,serif;

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 'Public Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:14px 28px;background:rgba(255,255,255,.94);border-bottom:1px solid var(--line)}
.logo{font:500 23px var(--serif);color:var(--ink);text-decoration:none;letter-spacing:-.3px}.logo::after{content:'.';color:var(--acc)}

nav a:hover,nav a.on{color:var(--ink);background-size:calc(100% - 20px) 2px;background-position:10px bottom}
header button.ghost{color:var(--mute)}header button.ghost:hover{color:var(--ink)}
.api-badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:12px;background:var(--okb);color:var(--ok);margin-left:8px;border:1px solid #d0e5d5}
.api-badge.offline{background:var(--soft);color:var(--mute);border-color:var(--line)}
.api-dot{width:6px;height:6px;border-radius:50%;background:currentColor}

h1{font:500 clamp(40px,7vw,68px)/1.03 var(--serif);letter-spacing:-1.8px;margin:0 0 20px}h1 em{font-style:italic;color:var(--acc)}
h2{font:500 30px/1.2 var(--serif);margin:0 0 6px;letter-spacing:-.5px}h3{font-size:15px;font-weight:600;margin:0 0 8px}
p{margin:0 0 12px}.mute{color:var(--mute)}.sm{font-size:13px}
button,.btn{font:inherit;font-weight:500;padding:9px 16px;border-radius:6px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;transition:border-color .2s,background .2s,color .2s,transform .15s}
button:hover{border-color:var(--ink)}button:active{transform:scale(.97)}
button.pri{background:var(--ink);border-color:var(--ink);color:#fff}button.pri:hover{background:var(--acc);border-color:var(--acc)}
button.ghost{border:0;background:none;color:var(--mute);padding:9px 10px}button.ghost:hover{color:var(--ink)}button:disabled{opacity:.4;cursor:not-allowed}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:22px;transition:border-color .25s,transform .25s}.card:hover{border-color:#cdc9c1}
.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}

label{display:block;font-weight:500;font-size:13px;margin:14px 0 5px}
input,textarea,select{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);transition:border-color .2s,box-shadow .2s}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 3px rgba(17,17,17,.07)}
textarea{resize:vertical;min-height:110px}
.auth{max-width:400px;margin:28px auto}.err{color:var(--bad);font-size:13px;min-height:20px;margin-top:8px}
.stat{font:500 36px/1.1 var(--serif);letter-spacing:-.5px}.big{font:500 64px/1 var(--serif);letter-spacing:-2px}
.bar{height:4px;background:var(--line);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc);border-radius:4px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:4px;background:var(--soft);color:var(--ink);font-size:12px;font-weight:500;margin:0 6px 6px 0}
.chip.ok{background:var(--okb);color:var(--ok)}.chip.wa{background:var(--warnb);color:var(--warn)}.chip.ba{background:var(--badb);color:var(--bad)}.chip button{border:0;background:none;padding:0;color:inherit;cursor:pointer;font-size:14px;line-height:1}
.drop{border:1px dashed #cdc9c1;border-radius:8px;padding:32px;text-align:center;color:var(--mute);cursor:pointer;transition:border-color .2s,background .2s}.drop.on,.drop:hover{border-color:var(--ink);background:var(--soft)}
.q{padding:18px 0;border-bottom:1px solid var(--line)}.q:last-child{border:0}
.ans{background:var(--soft);border-radius:6px;padding:16px;margin-top:12px;animation:up .35s ease both}.ans b{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin-top:10px}.ans b:first-child{margin-top:0}
.sel{cursor:pointer;border:1px solid var(--line);border-radius:8px;padding:16px;background:#fff;transition:border-color .2s,background .2s}.sel:hover{border-color:var(--ink)}.sel.on{border-color:var(--ink);background:var(--soft);box-shadow:inset 0 0 0 1px var(--ink)}
.ov{position:fixed;inset:0;background:rgba(255,255,255,.92);display:grid;place-items:center;z-index:9;animation:fade .3s both}
.spin{width:30px;height:30px;border:2px solid var(--line);border-top-color:var(--ink);border-radius:50%;animation:s .8s linear infinite;margin:0 auto 14px}
#toast{position:fixed;bottom:calc(22px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:6px;font-weight:500;font-size:14px;display:none;z-index:20;animation:up .3s both}
.tbl{overflow-x:auto}ol.steps{padding-left:20px;margin:0}ol.steps li{margin-bottom:6px}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes grow{from{width:0}}
@keyframes s{to{transform:rotate(360deg)}}
.enter>*{animation:up .6s cubic-bezier(.2,.7,.2,1) both}
.enter .grid>*{animation:up .6s cubic-bezier(.2,.7,.2,1) both}
.enter .grid>*:nth-child(2){animation-delay:.08s}.enter .grid>*:nth-child(3){animation-delay:.16s}.enter .grid>*:nth-child(4){animation-delay:.24s}.enter .grid>*:nth-child(5){animation-delay:.32s}.enter .grid>*:nth-child(6){animation-delay:.4s}
.enter>*:nth-child(2){animation-delay:.07s}.enter>*:nth-child(3){animation-delay:.14s}.enter>*:nth-child(4){animation-delay:.21s}
.enter .bar i{animation:grow 1.1s .25s cubic-bezier(.2,.7,.2,1) both}
@media print{header,.noprint{display:none!important}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const API_BASE = window.INTERVIEWACE_API_URL || 'http://localhost:8000';
let backendOnline = false;

// Check backend connectivity
async function checkBackend() {
  try {
    const res = await fetch(API_BASE + '/health', { signal: AbortSignal.timeout(2000) });
    if (res.ok) {
      const data = await res.json();
      backendOnline = data.database === 'connected' || data.status === 'ok';
    } else {
      backendOnline = false;
    }
  } catch (e) {
    backendOnline = false;
  }
}
checkBackend();
setInterval(checkBackend, 15000);

const api = {
  async get(path) {
    try {
      const h = S.token ? { 'Authorization': 'Bearer ' + S.token } : {};
      const res = await fetch(API_BASE + path, { headers: h });
      if (!res.ok) return null;
      return await res.json();
    } catch (e) { return null; }
  },
  async post(path, body, isForm) {
    try {
      const h = S.token ? { 'Authorization': 'Bearer ' + S.token } : {};
      if (!isForm && !(body instanceof FormData)) h['Content-Type'] = 'application/json';
      const res = await fetch(API_BASE + path, {
        method: 'POST',
        headers: h,
        body: isForm || (body instanceof FormData) ? body : JSON.stringify(body)
      });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        return { error: err.detail || ('Request failed (' + res.status + ')') };
      }
      return await res.json();
    } catch (e) { return { error: e.message }; }
  }
};

const SK={Python:'Language',JavaScript:'Language',Django:'Framework',Flask:'Framework',FastAPI:'Framework',React:'Framework',SQL:'Data',PostgreSQL:'Data',Redis:'Data',Git:'Tools',Docker:'Tools',AWS:'Tools','CI/CD':'Tools',Testing:'Tools','REST APIs':'Concepts','Data Structures':'Concepts',Communication:'Soft skills',Agile:'Soft skills'};
const AL={'REST APIs':['rest'],Testing:['pytest','testing','unit test'],PostgreSQL:['postgres'],'CI/CD':['ci/cd','github actions','jenkins'],'Data Structures':['data structure','algorithm'],Communication:['communicat','present'],Agile:['agile','scrum'],AWS:['aws','amazon web']};
const GR=[['Django','Flask','FastAPI'],['SQL','PostgreSQL'],['AWS','Docker'],['Testing','CI/CD'],['JavaScript','React']];
const RS0=['Python','Django','SQL','Git','Flask','Communication','Data Structures'],JS0=['Python','Django','PostgreSQL','REST APIs','Docker','AWS','Testing','Git','Agile'];
const Q=[
{c:'Technical',d:'Easy',q:'What is the difference between a list and a tuple in Python?',sk:['Python'],kw:['mutable','immutable','tuple','list','hashable'],t:['Lists are mutable sequences; tuples are immutable.','Immutability lets tuples act as dictionary keys and makes them slightly lighter. Use lists for collections that change and tuples for fixed records.','When would you use a dataclass or named tuple instead?']},
{c:'Technical',d:'Medium',q:'How do you avoid the N+1 query problem in the Django ORM?',sk:['Django','SQL'],kw:['select_related','prefetch_related','query','join','queryset'],t:['N+1 happens when related rows are fetched one query at a time inside a loop.','Use select_related for foreign keys (a SQL join) and prefetch_related for many-to-many or reverse relations. Check the query count with Django Debug Toolbar.','How would you find N+1 problems in production?']},
{c:'Technical',d:'Medium',q:'Design a REST API for a task manager app.',sk:['REST APIs'],kw:['endpoint','get','post','status code','authentication','validation'],t:['Model resources (users, tasks) and map HTTP verbs to actions.','Example: GET/POST /tasks, GET/PATCH/DELETE /tasks/{id}. Return correct status codes, validate input, paginate lists, and protect routes with token authentication.','How would you version this API?']},
{c:'Technical',d:'Hard',q:'Explain the Python GIL and when it matters.',sk:['Python'],kw:['gil','thread','multiprocessing','cpu','asyncio','i/o'],t:['The Global Interpreter Lock lets only one thread run Python bytecode at a time.','It hurts CPU-bound threaded code but not I/O-bound work. Use multiprocessing for CPU work and asyncio or threads for I/O.','Does the GIL make Python code thread-safe?']},
{c:'Technical',d:'Medium',q:'How would you speed up a slow SQL query?',sk:['SQL','PostgreSQL'],kw:['index','explain','join','query plan','select'],t:['Measure first, then optimize.','Run EXPLAIN ANALYZE, add indexes on filtered and joined columns, select only needed columns, and avoid functions on indexed columns.','What are the downsides of too many indexes?']},
{c:'Technical',d:'Easy',q:'How do you use Git in a team?',sk:['Git'],kw:['branch','merge','pull request','commit','conflict'],t:['Feature branches keep main stable.','Branch from main, commit small changes with clear messages, open a pull request for review, resolve conflicts by rebasing or merging, then merge.','Merge versus rebase: when do you use each?']},
{c:'Technical',d:'Medium',q:'How do you test a Python application?',sk:['Testing','Python'],kw:['pytest','unit','mock','fixture','coverage','integration'],t:['Use a test pyramid: many unit tests, fewer integration tests.','Write unit tests with pytest, use fixtures for setup, mock external services, and track coverage in CI.','How do you test code that calls a third-party API?']},
{c:'Behavioral',d:'Medium',q:'Tell me about a project you are proud of.',sk:['Communication'],kw:['project','built','result','team','challenge'],h:'Pick a project from your resume. Say what the problem was, your part, what you built, and a measurable result.'},
{c:'Behavioral',d:'Medium',q:'Describe a time you disagreed with a teammate.',sk:['Communication','Agile'],kw:['listened','agreed','team','compromise','result'],h:'Show you listened, shared data, found a compromise, and kept the relationship strong.'},
{c:'Situational',d:'Medium',q:'You find a serious bug the day before a release. What do you do?',sk:['Testing','Communication'],kw:['reproduce','priority','communicate','fix','test','team'],h:'Reproduce it, judge the impact, tell the team early, then fix, test, or delay with a clear reason.'},
{c:'Situational',d:'Hard',q:'Requirements change halfway through a sprint. How do you respond?',sk:['Agile'],kw:['scope','prioritize','product owner','sprint','communicate'],h:'Clarify the change, discuss trade-offs with the product owner, re-prioritize, and update the plan.'},
{c:'HR & culture',d:'Easy',q:'Why do you want this role?',sk:['Communication'],kw:['role','company','skills','grow','team','learn'],h:'Link your skills to the job, show you know the company, and say how you want to grow.'},
{c:'HR & culture',d:'Easy',q:'Where do you see yourself in five years?',sk:['Communication'],kw:['grow','learn','lead','skills','team'],h:'Show realistic growth within the field, with skills you will build and the impact you want.'}];
const CATS=['Technical','Behavioral','Situational','HR & culture'],MET=['Relevance','Completeness','Specificity','Structure','Communication'];
let S={logs:[],dr:[],prof:{role:'',company:'',inst:'',deg:'',yr:'',gpa:'',loc:'',pace:140,fill:'medium',rigor:'strict',lang:'en'},user:null,users:{},sessions:[],resumes:[],ready:false,rs:[],js:[],edu:'',proj:'',resp:'',jd:{title:'',company:''},f:{c:'All',d:'All',b:false},open:null,bm:[],sess:null,view:null,file:'',sample:false,mode:'quick',cat:'Technical',timer:null,token:null,active_file_blob:null,backend_jd_id:null,backend_resume_id:null,backend_session_id:null,practice_id:null};
try{const d=JSON.parse(localStorage.getItem('ia')||'{}');S.users=d.users||{};S.sessions=d.sessions||[];S.user=d.user||null;S.token=d.token||null;S.resumes=d.resumes||[];S.bm=d.bm||[];S.logs=d.logs||[];S.dr=d.dr||[];S.prof=Object.assign(S.prof,d.prof||{})}catch(e){}
const save=()=>{try{localStorage.setItem('ia',JSON.stringify({users:S.users,sessions:S.sessions,user:S.user,token:S.token,resumes:S.resumes,bm:S.bm,logs:S.logs,dr:S.dr,prof:S.prof}))}catch(e){}};
const go=r=>location.hash=='#/'+r?render():location.hash='#/'+r;
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t.k);t.k=setTimeout(()=>t.style.display='none',2600)};
const mine=()=>S.sessions.filter(x=>x.u==(S.user&&S.user.email));
const H=async p=>{try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(p));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return btoa(p)}};
const detect=t=>{t=t.toLowerCase();return Object.keys(SK).filter(k=>(AL[k]||[k.toLowerCase()]).some(a=>t.includes(a)))};
const gap=()=>{const st=[],pa=[],ga=[];S.js.forEach(s=>{if(S.rs.includes(s))st.push(s);else{const g=GR.find(x=>x.includes(s));g&&g.some(x=>S.rs.includes(x))?pa.push(s):ga.push(s)}});return{st,pa,ga,pct:Math.round((st.length+pa.length*.5)/Math.max(S.js.length,1)*100)}};
const rel=q=>{const g=gap(),n=q.sk.filter(s=>g.ga.includes(s)).length*2+q.sk.filter(s=>g.pa.includes(s)).length+q.sk.filter(s=>S.js.includes(s)).length;return n};
const ordered=()=>[...Q].sort((a,b)=>rel(b)-rel(a));
const bar=v=>`<div class=bar><i style="width:${v}%"></i></div>`;
const clamp=v=>Math.max(0,Math.min(100,Math.round(v)));

function nav(r){const a=S.user?[['dashboard','Dashboard'],['upload','New preparation'],['questions','Questions'],['practice','Practice'],['report','Reports'],['history','History'],['progress','Progress'],['records','Cloud tasks'],['settings','Settings']]:[['landing','Home'],['feat','Features'],['about','About'],['login','Login'],['register','Register']];
const badge = `<span class="api-badge ${backendOnline?'':'offline'}" title="API: ${API_BASE}"><span class=api-dot></span>${backendOnline?'API Connected':'Local Mode'}</span>`;
return`<header><div class=row><a class=logo href="#/${S.user?'dashboard':'landing'}">InterviewAce</a>${badge}</div><nav>${a.map(([k,l])=>`<a href="#/${k}" class="${r==k?'on':''}">${L(l)}</a>`).join('')}${S.user?'<button class=ghost onclick="logout()">Log out</button>':''}</nav></header>`}
function logout(){S.user=null;S.token=null;S.sess=null;S.ready=false;save();go('landing')}

const P={};
P.landing=()=>`<section class=hero><div><h1>Prepare smarter.<br><em>Interview better.</em></h1><p class=mute style="font-size:17px;max-width:460px">Upload your resume and a job description. InterviewAce finds your skill gaps, writes questions for the role, and scores your practice answers.</p><div class=row><button class=pri onclick="go('register')">Get started</button><button onclick="go('login')">Log in</button></div></div>
<div class=card><div class="row sp"><b>Python Developer</b><span class="chip ok">Sample preview</span></div><div class=stat style="margin:10px 0 4px">72%</div><p class="mute sm">Match with the job description</p>${bar(72)}<div class=mt>${[['Python','ok','Strong'],['PostgreSQL','wa','Partial'],['Docker','ba','Gap']].map(x=>`<div class="row sp" style="padding:6px 0;border-top:1px solid var(--line)"><span>${x[0]}</span><span class="chip ${x[1]}" style="margin:0">${x[2]}</span></div>`).join('')}</div></div></section>
<section id=feat class="grid g3"><div class=card><h3>Find your gaps</h3><p class=mute>See which required skills you already have, partly have, or are missing.</p></div><div class=card><h3>Questions for the role</h3><p class=mute>Technical, behavioral, situational and culture questions with answer frameworks.</p></div><div class=card><h3>Scored practice</h3><p class=mute>Get feedback on relevance, structure and detail, then retry until it improves.</p></div></section>
<section class="grid g3 mt"><div class=card><h3>Speak or type</h3><p class=mute>Answer with your voice using the mic, or type. Live rubric chips show which key points you covered.</p></div><div class=card><h3>Speech metrics</h3><p class=mute>Filler-word rate and speaking pace on every answer and report.</p></div><div class=card><h3>Choose your coach</h3><p class=mute>Supportive coach, strict hiring panel, or a stress panel that scores harder.</p></div><div class=card><h3>History and progress</h3><p class=mute>Search past plans, archive old ones, and track growth against company bars.</p></div><div class=card><h3>Task log and backup</h3><p class=mute>See what the app did for you, then back up and restore your data.</p></div><div class=card><h3>11 languages</h3><p class=mute>${LANGS.map(x=>x[1]).join(' · ')}</p></div></section><section id=about class="card mt"><h2>How it works</h2><ol class=steps><li>Create an account and open your dashboard.</li><li>Upload a resume and a job description.</li><li>Check the details the AI extracted.</li><li>Review your skill gap analysis.</li><li>Learn questions and suggested answers.</li><li>Practice, get feedback, and read your session report.</li></ol></section>`;

P.register=()=>`<div class="card auth"><h2>Create account</h2><p class=mute>Start preparing in a minute.</p><form onsubmit="return reg(event)"><label>Full name</label><input id=n required><label>Email</label><input id=e type=email required><label>Password</label><input id=p type=password minlength=8 required><label>Confirm password</label><input id=p2 type=password required><div class=err id=er></div><button class=pri style="width:100%">Create account</button></form><p class="mute sm mt">Already registered? <a href="#/login">Log in</a></p></div>`;
async function reg(ev){
  ev.preventDefault();
  const n=$('#n').value.trim(),e=$('#e').value.trim().toLowerCase(),p=$('#p').value;
  if(p!=$('#p2').value)return $('#er').textContent='Passwords do not match.',false;
  
  // Try Backend API registration first
  if (backendOnline) {
    const r = await api.post('/api/v1/auth/register', { full_name: n, email: e, password: p });
    if (r && r.error && !r.error.includes('already registered')) {
      return $('#er').textContent = r.error, false;
    }
    const form = new URLSearchParams({ username: e, password: p });
    const lr = await api.post('/api/v1/auth/login', form, true);
    if (lr && lr.access_token) {
      S.token = lr.access_token;
    }
  }

  S.users[e]={name:n,h:await H(p)};
  S.user={email:e,name:n};
  save();
  toast('Account created');
  go('dashboard');
  return false;
}

P.login=()=>`<div class="card auth"><h2>Welcome back</h2><p class=mute>Sign in to continue your preparation.</p><form onsubmit="return login(event)"><label>Email</label><input id=e type=email required><label>Password</label><input id=p type=password required><div class=err id=er></div><button class=pri style="width:100%">Sign in</button></form><button style="width:100%;margin-top:10px" onclick="guest()">Continue as guest</button><div class="row sp mt"><button class=ghost onclick="toast('Password reset is not available in this demo.')">Forgot password</button><a href="#/register">Create account</a></div></div>`;
async function login(ev){
  ev.preventDefault();
  const e=$('#e').value.trim().toLowerCase(),p=$('#p').value;
  
  // Try Backend API login
  if (backendOnline) {
    const form = new URLSearchParams({ username: e, password: p });
    const lr = await api.post('/api/v1/auth/login', form, true);
    if (lr && lr.access_token) {
      S.token = lr.access_token;
      const me = await api.get('/api/v1/auth/me');
      S.user = { email: e, name: (me && me.full_name) || (S.users[e] && S.users[e].name) || e.split('@')[0] };
      save();
      toast('Signed in');
      go('dashboard');
      return false;
    }
  }

  // Local fallback
  const u=S.users[e];
  if(!u||u.h!=await H(p))return $('#er').textContent='Email or password is incorrect.',false;

async function analyze(){
  const rt=$('#rt').value,jd=$('#jd').value,jt=$('#jt').value.trim();

  if(!jd.trim()&&!jt)return toast('Add a job title or description.');

  S.rs=rt.trim()&&a.length?a:[...RS0];
  S.js=b.length?b:[...JS0];
  S.resp=jd.slice(0,300);
  if(S.file&&!S.resumes.includes(S.file)&&!S.sample)S.resumes.push(S.file);
  save();

  $('#ovl').innerHTML='<div class=ov><div class=card style="text-align:center"><div class=spin></div><b id=ms>Reading your resume…</b></div></div>';

  // Attempt real backend AI integration if connected
  if (backendOnline && S.token) {
    try {
      // 1. Submit JD
      const jdResp = await api.post('/api/v1/jd/paste', { raw_text: jd || jt });
      if (jdResp && jdResp.jd_id) {
        S.backend_jd_id = jdResp.jd_id;
        if (jdResp.parsed_data && jdResp.parsed_data.required_skills) {
          const reqs = jdResp.parsed_data.required_skills.map(s => typeof s === 'string' ? s : (s.name || s.skill)).filter(Boolean);

        const resResp = await api.post('/api/v1/resume/upload', fd);
        if (resResp && resResp.resume_id) {

          if (resResp.parsed_data && resResp.parsed_data.skills) {
            const rskills = (resResp.parsed_data.skills.technical_skills || []).map(s => typeof s === 'string' ? s : (s.name || s.skill)).filter(Boolean);
            if (rskills.length) S.rs = rskills;
          }
        }
      }

      // 3. Trigger Session & Gap Analysis
      if (S.backend_jd_id && S.backend_resume_id) {
        const sessResp = await api.post('/api/v1/session/create', { resume_id: S.backend_resume_id, jd_id: S.backend_jd_id });

        }

    }
  }

  setTimeout(()=>$('#ms')&&($('#ms').textContent='Comparing with the job description…'),600);
  setTimeout(()=>{
    S.ready=true;
    log('parse_resume','Parsed '+(S.file||'pasted resume')+' and the job description',1200);
    go('review');
  },1200);
}

<div class="row mt"><button onclick="$('#hn').textContent='Hint: mention '+Q[${Q.indexOf(q)}].kw.slice(0,3).join(', ')">Hint</button><button id=mic onclick="mic()">Speak</button><button onclick="skipQ()">Skip</button><button class=pri onclick="submitA()">Submit answer</button><button class=ghost onclick="endSess()">End session</button></div></div>`};
const FW=/\b(um+|uh+|like|you know|basically|actually)\b/g;
const wc=()=>{const v=$('#an').value,l=v.toLowerCase(),w=v.trim().split(/\s+/).filter(Boolean).length,f=(l.match(FW)||[]).length,q=S.sess.list[S.sess.i];$('#wc').textContent=w+' words · '+f+' filler';$('#rb').innerHTML='<span class=mute>Rubric:</span> '+q.kw.map(k=>`<span class="chip ${l.includes(k)?'ok':''}">${l.includes(k)?'✓ ':''}${k}</span>`).join('')};
function startTimer(){clearInterval(S.timer);S.t0=Date.now();try{wc()}catch(e){}let t=180;const f=()=>{const e=$('#tm');if(!e)return clearInterval(S.timer);e.textContent=t>0?Math.floor(t/60)+':'+String(t%60).padStart(2,'0'):'Time is up';if(t>0)t--};f();S.timer=setInterval(f,1000)}
function score(q,t){const w=t.trim().split(/\s+/).filter(Boolean).length,l=t.toLowerCase(),hit=q.kw.filter(k=>l.includes(k)),miss=q.kw.filter(k=>!l.includes(k));
const nums=(t.match(/\d+/g)||[]).length,proj=(l.match(/project|built|implemented|used|using|created|developed/g)||[]).length;
const st=(l.match(/situation|task|action|result|outcome|as a result|responsible|when i|first|then|because|for example|however|therefore/g)||[]).length;
const sc=[clamp(15+hit.length/q.kw.length*85),clamp(w/110*100),clamp(20+nums*15+proj*10+hit.length*6),clamp(20+st*14+(w>40?15:0)),clamp(25+Math.min(w,90)*.6-(w>0&&w/Math.max(1,(t.match(/[.!?]/g)||[]).length)>40?15:0))];
const ov=clamp(Math.round(sc.reduce((a,b)=>a+b,0)/5)+({supportive:6,strict:0,hostile:-6}[S.prof.rigor]||0)),low=sc.indexOf(Math.min(...sc));
const tips=['Cover the core terms the interviewer expects.','Add more depth: explain why, not only what.','Add a concrete example from a project, with a number.','Structure it: context, action, result.','Use shorter sentences and a clear opening line.'];
return{fill:Math.round((l.match(FW)||[]).length/Math.max(w,1)*100),wpm:Math.round(w/Math.max((Date.now()-(S.t0||Date.now()))/60000,.25)),sc,ov,strong:[...(hit.length?['Covered key ideas: '+hit.slice(0,3).join(', ')]:[]),...(w>=60?['Good level of detail']:[]),...(nums?['Used specific numbers']:[])],miss:miss.slice(0,3),tip:tips[low]}}

async function submitA(){
  const t=$('#an').value;
  if(t.trim().split(/\s+/).filter(Boolean).length<3)return toast('Write a little more before submitting.');
  const s=S.sess,q=s.list[s.i],r=score(q,t);
  s.last={q:Q.indexOf(q),ans:t,...r};

  // Live Backend AI Evaluation
  if (backendOnline && S.token && S.practice_id) {
    toast('Grading answer with AI…');
    const qid = q.question_id || ('q-' + (s.i + 1));
    const evalRes = await api.post(`/api/v1/practice/${S.practice_id}/submit`, {
      question_id: qid,
      student_answer: t,
      time_taken_seconds: Math.round((Date.now() - (S.t0 || Date.now())) / 1000)
    });
    if (evalRes && evalRes.evaluation) {
      const ev = evalRes.evaluation;
      if (ev.overall_score != null) s.last.ov = ev.overall_score;
      if (ev.strengths && ev.strengths.length) s.last.strong = ev.strengths;
      if (ev.key_points_missed && ev.key_points_missed.length) s.last.miss = ev.key_points_missed;
      if (ev.specific_tip) s.last.tip = ev.specific_tip;
      if (ev.dimension_scores) {
        const ds = ev.dimension_scores;
        s.last.sc = [
          (ds.relevance && ds.relevance.score) || 20,
          (ds.completeness && ds.completeness.score) || 20,
          (ds.specificity && ds.specificity.score) || 16,
          (ds.structure && ds.structure.score) || 12,
          (ds.communication && ds.communication.score) || 12
        ];
      }
    }
  }

  s.res[s.i]=s.last;
  go('feedback');
}

function skipQ(){
  const s=S.sess;
  const qid = s.list[s.i].question_id || ('q-' + (s.i + 1));
  if (backendOnline && S.token && S.practice_id) {
    api.post(`/api/v1/practice/${S.practice_id}/skip`, { question_id: qid });
  }
  s.res[s.i]={q:Q.indexOf(s.list[s.i]),skipped:true};
  nextQ();
}

function nextQ(){const s=S.sess;s.i++;s.i>=s.list.length?finish():go('practice')}
function endSess(){finish()}

async function finish(){
  clearInterval(S.timer);
  const s=S.sess,a=s.res.filter(r=>r&&!r.skipped);
  s.live=false;
  if(!a.length)return toast('No answers submitted.'),go('dashboard');
  const cats={},cn={};
  a.forEach(r=>{const c=Q[r.q].c;cats[c]=(cats[c]||0)+r.ov;cn[c]=(cn[c]||0)+1});
  Object.keys(cats).forEach(c=>cats[c]=Math.round(cats[c]/cn[c]));
  const mets=MET.map((_,i)=>Math.round(a.reduce((x,r)=>x+r.sc[i],0)/a.length));
  
  // Complete backend session if active
  if (backendOnline && S.token && S.practice_id) {
    api.post(`/api/v1/practice/${S.practice_id}/complete`);
  }

  S.sessions.push({
    u:S.user.email,
    date:new Date().toLocaleDateString(),
    mode:s.mode,
    ov:Math.round(a.reduce((x,r)=>x+r.ov,0)/a.length),
    cats,
    mets,
    role:S.jd.title||S.prof.role||'Target role',
    co:S.jd.company||S.prof.company||'My practice',
    fill:Math.round(a.reduce((x,r)=>x+(r.fill||0),0)/a.length),
    wpm:Math.round(a.reduce((x,r)=>x+(r.wpm||0),0)/a.length),
    items:s.res.filter(Boolean).map(r=>({q:Q[r.q].q,c:Q[r.q].c,ov:r.skipped?null:r.ov}))
  });
  S.view=S.sessions.length-1;
  log('simulation_run',s.mode+': '+a.length+' answers scored',Date.now()-(s.t00||Date.now()));
  save();
  go('report');
}
